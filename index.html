
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Coin Collector</title>

  <!-- A-Frame VR engine -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 18px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="hud">
    🪙 Coins: <span id="score">0</span> / 10
    <br>
    <small>Walk around or use WASD to collect coins!</small>
  </div>

  <a-scene
    background="color: #10152b"
    renderer="antialias: true"
    game-manager>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>

    <a-entity
      light="type: directional; intensity: 1.5"
      position="-3 8 5">
    </a-entity>

    <!-- Ground -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#252d46"
      shadow>
    </a-plane>

    <!-- Grid floor decoration -->
    <a-grid
      position="0 0.02 0"
      width="30"
      height="30"
      color="#586b9b">
    </a-grid>

    <!-- Arena walls -->
    <a-box position="0 1 -15"
      width="30" height="2" depth="0.3"
      color="#39456b"></a-box>

    <a-box position="0 1 15"
      width="30" height="2" depth="0.3"
      color="#39456b"></a-box>

    <a-box position="-15 1 0"
      width="0.3" height="2" depth="30"
      color="#39456b"></a-box>

    <a-box position="15 1 0"
      width="0.3" height="2" depth="30"
      color="#39456b"></a-box>

    <!-- Obstacles -->
    <a-box position="-4 0.8 -3"
      width="2" height="1.6" depth="2"
      color="#e85d75"></a-box>

    <a-box position="4 0.8 -6"
      width="2" height="1.6" depth="2"
      color="#e85d75"></a-box>

    <a-cylinder position="3 1 3"
      radius="0.8" height="2"
      color="blue"></a-cylinder>

    <a-box position="-5 0.7 6"
      width="2" height="1.4" depth="2"
      color="#6c63ff"></a-box>

    <!-- Ten collectible coins -->
    <a-entity class="coin" position="0 1.2 -3">
      <a-sphere radius="0.35" color="#ffcc33"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
      <a-ring radius-inner="0.4" radius-outer="0.5"
        color="#fff078" rotation="90 0 0"></a-ring>
      <a-animation attribute="rotation"
        to="0 360 0" dur="2500" repeat="indefinite"
        easing="linear"></a-animation>
    </a-entity>

    <a-entity class="coin" position="5 1.2 -2">
      <a-sphere radius="0.35" color="#ffcc33"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="-6 1.2 -6">
      <a-sphere radius="0.35" color="#ffcc33"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="7 1.2 5">
      <a-sphere radius="0.35" color="green"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="-8 1.2 2">
      <a-sphere radius="0.35" color="green"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="0 1.2 7">
      <a-sphere radius="0.35" color="green"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="-10 1.2 -10">
      <a-sphere radius="0.35" color="green"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="10 1.2 -9">
      <a-sphere radius="0.35" color="green"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="-3 1.2 10">
      <a-sphere radius="0.35" color="green"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <a-entity class="coin" position="10 1.2 10">
      <a-sphere radius="0.35" color="green"
        material="emissive: #ff9900; emissiveIntensity: 0.8"></a-sphere>
    </a-entity>

    <!-- Player camera -->
    <a-entity id="player" position="0 0 5">
      <a-camera
        position="0 1.6 0"
        wasd-controls="acceleration: 18"
        look-controls="pointerLockEnabled: false">
      </a-camera>
    </a-entity>

    <!-- VR entry button is created automatically by A-Frame -->

  </a-scene>

  <script>
    AFRAME.registerComponent("game-manager", {
      init: function () {
        this.score = 0;
        this.camera = document.querySelector("#player")
          .querySelector("a-camera");
        this.scoreText = document.querySelector("#score");
        this.coins = Array.from(document.querySelectorAll(".coin"));
        this.cameraPosition = new THREE.Vector3();
        this.coinPosition = new THREE.Vector3();
        this.finished = false;
      },

      tick: function () {
        if (this.finished || !this.camera) return;

        this.camera.object3D.getWorldPosition(this.cameraPosition);

        this.coins.forEach((coin) => {
          if (!coin.parentNode) return;

          coin.object3D.getWorldPosition(this.coinPosition);

          // Collect a coin when the player gets close.
          if (this.cameraPosition.distanceTo(this.coinPosition) < 1.2) {
            coin.parentNode.removeChild(coin);
            this.score++;
            this.scoreText.textContent = this.score;

            if (this.score >= 10) {
              this.finished = true;
              document.getElementById("hud").innerHTML =
                "🏆 YOU WIN!<br>All 10 coins collected!";
            }
          }
        });
      }
    });
  </script>
</body>
</html>
